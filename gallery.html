<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026 | Media Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <div style="display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; background-color: #09090b; border: 3px solid #facc15; border-radius: 16px; font-family: monospace; font-size: 2.2rem; font-weight: 900; color: #facc15; box-shadow: 0 0 15px rgba(250, 204, 21, 0.3); margin-bottom: 10px;">
                &lt;/&gt;
            </div>
            <h1>TECH<span style="color: #facc15;">FEST</span> 2026</h1>
        </div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="contact.html">Contact</a> 
    </nav>

    <main>
      
        <section id="photo-gallery">
            <h2>Event Highlights in Frames</h2>
            <div class="gallery-grid">
                <img src="images/image.webp" alt="Hackathon Main Arena Assembly" class="gallery-img">
                <img src="images/arena.webp" alt="Robotics Arena Drone Inspections" class="gallery-img">
                <img src="images/bg (1).png" alt="Machine Learning Expert Panel" class="gallery-img">
                <img src="images/bg (2).png" alt="UI Design Sprint Collaboration" class="gallery-img">
                <img src="images/speaker.webp" alt="Cybersecurity Command Terminal Matrix" class="gallery-img">
                <img src="images/gameplay.webp" alt="Grand Technology Trade Expo Exhibition" class="gallery-img">
            </div>
        </section>

        
        <section id="multimedia-showcase">
            <h2>Interactive Media Stream</h2>
            <div class="media-container">
                <div class="video-box">
                    <h3>Official TechFest 2026 Trailer stay tuned...</h3>
                   
                    <video controls poster="images/video-thumbnail.jpg">
                        <source src="media/tech video.mp4.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="audio-box">
                    <h3>Tech fest theme (self made)</h3>
                    <audio controls>
                        <source src="media/techfest-theme.mp3.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>
            </div>
        </section>
    </main>

    <a href="register.html" class="floating-btn">Register Now</a>

    <footer>
        <p>&copy; 2026 TechFest — Built with creativity</p>
    </footer>

</body>
</html>
